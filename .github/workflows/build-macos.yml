name: Build (GitHub-hosted)

# development.yml targets the upstream self-hosted runner (J316sAP), which
# forks can't use. This builds the iOS ipa on a GitHub-hosted macOS runner.

on:
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: iOS build
    # Xcode 26 (iOS 26 SDK) is required, e.g. for UIBarButtonItem.sharesBackground
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: brew install ldid make

      - name: Build ipa
        run: |
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 \
            BOOTJDK="$JAVA_HOME/bin" \
            SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-ios.ipa
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: warn
